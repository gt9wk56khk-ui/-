<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#10151d"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png"><title>株ログ</title><style>
*{box-sizing:border-box}body{background:#10151d;color:#edf2f7;font:14px system-ui;margin:auto;padding:12px 10px calc(90px + env(safe-area-inset-bottom));max-width:620px}h1{font-size:22px}section{background:#1b2430;border-radius:16px;padding:15px;margin:12px 0}small{color:#a0adbd}strong{font-size:26px;display:block}.grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:3px}.day{min-height:78px;padding:5px 2px;border:1px solid #344252;border-radius:6px;overflow:hidden;text-align:left;font-variant-numeric:tabular-nums}.day small{font-size:clamp(8px,2.5vw,11px)}.off{opacity:.4}.target{font-size:clamp(8px,2.3vw,10px);color:#8290a0;display:block;margin-top:6px}.actual{font-size:clamp(8px,2.5vw,11px);display:block}.pos{color:#56d6a1}.neg{color:#ff8181}button,input{background:#263443;color:inherit;border:1px solid #425266;border-radius:8px;padding:9px;font:inherit;min-width:0}button{cursor:pointer}input{width:100%}label{display:block;color:#a0adbd;font-size:12px}nav{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}progress{width:100%;accent-color:#56d6a1}p{line-height:1.6}.today{border-color:#56d6a1}#tabs{position:fixed;bottom:0;left:0;right:0;z-index:50;background:#1b2430;border-top:1px solid #425266;padding:6px 8px calc(6px + env(safe-area-inset-bottom));display:flex;justify-content:center}#tabs button{flex:1;max-width:205px;background:none;border:0;color:#8290a0;font-size:12px}#tabs button.on{color:#56d6a1}#tabs svg{display:block;margin:0 auto 4px;width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7}#overlay{position:fixed;inset:0;background:#0009;z-index:999;display:flex;align-items:center;justify-content:center;padding:20px}.modal{background:#1b2430;border:1px solid #425266;border-radius:20px;padding:22px;width:100%;max-width:380px;max-height:90dvh;overflow:auto}input{font-size:16px}svg.chart{width:100%;height:auto;display:block}
</style><div id="app"></div><div id="edit"></div><div id="tabs"></div><script>
const $=id=>document.getElementById(id),iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`,dt=s=>new Date(s+'T12:00:00'),today=()=>new Intl.DateTimeFormat('sv-SE',{timeZone:'Asia/Tokyo'}).format(new Date()),yen=n=>Math.round(n).toLocaleString('ja-JP')+'円',pct=n=>Number.isFinite(n)?n.toFixed(1)+'%':'—',signed=n=>(n>0?'+':'')+yen(n),cls=n=>n<0?'neg':'pos';
let s={start:'2026-11-27',end:'2027-05-01',capital:1600000,goal:4000000,entries:{}};try{s=JSON.parse(localStorage.getItem('kabulog')||'null')||s}catch{}let month=dt(today());month.setDate(1);let tab='calendar';
function save(){try{localStorage.setItem('kabulog',JSON.stringify(s));return true}catch{alert('保存できません。バックアップを出力してください。');return false}}
const cache={};function holidays(y){if(cache[y])return cache[y];let h=new Set(),add=(m,d)=>h.add(iso(new Date(y,m-1,d,12))),nth=(m,n)=>1+(8-new Date(y,m-1,1).getDay())%7+7*(n-1);[[1,1],[2,11],[2,23],[4,29],[5,3],[5,4],[5,5],[8,11],[11,3],[11,23]].forEach(x=>add(...x));add(1,nth(1,2));add(7,nth(7,3));add(9,nth(9,3));add(10,nth(10,2));add(3,Math.floor(20.8431+.242194*(y-1980)-Math.floor((y-1980)/4)));add(9,Math.floor(23.2488+.242194*(y-1980)-Math.floor((y-1980)/4)));for(let d=new Date(y,0,2,12);d.getFullYear()===y;d.setDate(d.getDate()+1)){let a=new Date(d),b=new Date(d);a.setDate(a.getDate()-1);b.setDate(b.getDate()+1);if(d.getDay()!==0&&h.has(iso(a))&&h.has(iso(b)))h.add(iso(d))}for(let k of [...h].sort()){let d=dt(k);if(d.getDay()===0){do{d.setDate(d.getDate()+1)}while(h.has(iso(d)));h.add(iso(d))}}add(1,2);add(1,3);add(12,31);return cache[y]=h}
function trade(d){return d.getDay()>0&&d.getDay()<6&&!holidays(d.getFullYear()).has(iso(d))}function days(){let a=[];for(let d=dt(s.start);d<=dt(s.end);d.setDate(d.getDate()+1))if(trade(d))a.push(iso(d));return a}
function graph(all,past,daily){let actual=[s.capital];for(let k of all.slice(0,past))actual.push(actual.at(-1)+(s.entries[k]||0));let lo=Math.min(s.capital,s.goal,...actual),hi=Math.max(s.capital,s.goal,...actual),pad=Math.max((hi-lo)*.08,1);lo-=pad;hi+=pad;let x=i=>64+284*i/Math.max(1,all.length),y=v=>18+164*(hi-v)/(hi-lo),line=actual.map((v,i)=>`${x(i)},${y(v)}`).join(' ');return `<svg class="chart" viewBox="0 0 360 215" role="img" aria-label="目標資産と実績資産の推移">${Array.from({length:5},(_,i)=>{let v=hi-(hi-lo)*i/4;return `<line x1="64" x2="348" y1="${y(v)}" y2="${y(v)}" stroke="#344252" stroke-dasharray="3 4"/><text x="58" y="${y(v)+4}" text-anchor="end" fill="#a0adbd" font-size="10">${(v/10000).toLocaleString('ja-JP',{maximumFractionDigits:1})}万</text>`}).join('')}<line x1="${x(0)}" y1="${y(s.capital)}" x2="${x(all.length)}" y2="${y(s.goal)}" stroke="#8290a0" stroke-width="2" stroke-dasharray="5 5"/><polyline points="${line}" fill="none" stroke="#56d6a1" stroke-width="2.8" stroke-linejoin="round"/><circle cx="${x(actual.length-1)}" cy="${y(actual.at(-1))}" r="3.5" fill="#56d6a1"/><text x="64" y="205" fill="#a0adbd" font-size="10">${s.start}</text><text x="348" y="205" text-anchor="end" fill="#a0adbd" font-size="10">${s.end}</text></svg>`}
function render(){let all=days(),now=today(),hour=Number(new Intl.DateTimeFormat('en-GB',{timeZone:'Asia/Tokyo',hour:'2-digit',minute:'2-digit',hourCycle:'h23'}).format(new Date()).replace(':','')),past=all.filter(k=>k<now||(k===now&&(hour>=1530||k in s.entries))).length,left=all.length-past,g=s.goal-s.capital,daily=g/(all.length||1),total=all.slice(0,past).reduce((a,k)=>a+(s.entries[k]||0),0),p=total/g*100,pace=past/(all.length||1)*100,y=month.getFullYear(),m=month.getMonth(),prefix=iso(month).slice(0,7),md=all.filter(k=>k.startsWith(prefix)),records=Object.entries(s.entries).filter(([k])=>k.startsWith(prefix)),mt=records.reduce((a,[k,v])=>a+v,0),wins=records.filter(([k,v])=>v>0),losses=records.filter(([k,v])=>v<0),winTotal=wins.reduce((a,[k,v])=>a+v,0),lossTotal=losses.reduce((a,[k,v])=>a+v,0),winRate=wins.length+losses.length?wins.length/(wins.length+losses.length)*100:0;
$('tabs').innerHTML=[['calendar','カレンダー','<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 2v6m10-6v6M3 10h18"/>'],['progress','目標進捗','<path d="M3 3v18h18M6 16l5-6 4 3 6-8"/>'],['settings','設定','<circle cx="12" cy="12" r="4"/><path d="M12 2v4m0 12v4M2 12h4m12 0h4M5 5l3 3m8 8 3 3M5 19l3-3m8-8 3-3"/>']].map(([id,label,icon])=>`<button data-tab="${id}" class="${tab===id?'on':''}"><svg viewBox="0 0 24 24">${icon}</svg>${label}</button>`).join('');document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render();window.scrollTo(0,0)});
if(tab==='calendar'){$('app').innerHTML=`<section><nav><button id="prev">‹</button><b>${y}年 ${m+1}月</b><button id="next">›</button></nav><p>月間収支 ${yen(mt)} / 目標 ${yen(md.length*daily)}</p><div class="cal" id="cal">${['日','月','火','水','木','金','土'].map(x=>'<small style="text-align:center">'+x+'</small>').join('')}</div><div style="margin-top:20px;border-top:1px solid #425266;padding-top:15px"><small>${m+1}月の合計収支</small><strong class="${cls(mt)}">${signed(mt)}</strong><div class="grid" style="margin-top:15px"><div><small>利益合計</small><br><b class="pos">${yen(winTotal)}</b></div><div><small>損失合計</small><br><b class="neg">${yen(lossTotal)}</b></div><div><small>勝ち日数</small><br>${wins.length}日</div><div><small>負け日数</small><br>${losses.length}日</div><div><small>勝率</small><br>${pct(winRate)}</div><div><small>月間目標達成率</small><br><b class="${cls(mt)}">${md.length?pct(mt/(md.length*daily)*100):'—'}</b></div></div></div></section>`;let cal=$('cal');for(let i=0;i<new Date(y,m,1).getDay();i++)cal.append(document.createElement('div'));for(let i=1;i<=new Date(y,m+1,0).getDate();i++){let k=iso(new Date(y,m,i,12)),active=all.includes(k),v=s.entries[k],b=document.createElement('button');b.className='day'+(!active?' off':'')+(k===now?' today':'');b.innerHTML=`${i}<span class="target">${active?Math.round(daily).toLocaleString():!trade(dt(k))?'休場':''}</span>${v!==undefined?`<span class="actual ${cls(v)}">${v.toLocaleString()}</span><small>${active?pct(v/daily*100):'—'}</small>`:''}`;b.onclick=()=>edit(k);cal.append(b)}$('prev').onclick=()=>{month.setMonth(m-1);render()};$('next').onclick=()=>{month.setMonth(m+1);render()};}
if(tab==='progress'){$('app').innerHTML=`<h1>目標進捗</h1><section><div class="grid"><div><small>残り営業日</small><strong>${left} 日</strong><small>期限 ${s.end}</small></div><div><small>利益進捗率</small><strong class="${cls(p)}">${pct(p)}</strong><small>目標ライン ${pct(pace)}</small></div></div><progress max="100" value="${Math.max(0,p)}"></progress><p>目標ペースとの差 <b class="${cls(total-daily*past)}">${signed(total-daily*past)}</b></p><div class="grid"><div><small>現在資産</small><strong>${yen(s.capital+total)}</strong></div><div><small>累計収支</small><strong class="${cls(total)}">${signed(total)}</strong></div><div><small>当初の日次目標</small><br>${yen(daily)}</div><div><small>残り日次必要利益</small><br>${left?yen(Math.max(0,g-total)/left):'—'}</div></div></section><section><b>資産推移</b><p><small><span class="pos">━━ 実績</span>　┄┄ 目標計画</small></p>${graph(all,past,daily)}<small>目標期間内の営業日ベース・未入力日は収支0円として表示</small></section>`;}
if(tab==='settings'){$('app').innerHTML=`<h1>設定</h1><section><div class="grid"><label>開始日<input id="start" type="date" value="${s.start}"></label><label>期限<input id="end" type="date" value="${s.end}"></label><label>元手<input id="capital" type="number" value="${s.capital}"></label><label>目標資産<input id="goal" type="number" value="${s.goal}"></label></div><p><button id="apply">設定を保存</button></p></section><section><button id="csv">CSV出力</button> <button id="backup">バックアップ</button> <button id="restore">復元</button><input hidden type="file" id="file" accept="application/json"><p><small>端末内保存。税引前。通常の東証休場日を計算（臨時休場・祝日変更は未反映）。</small></p></section>`;$('apply').onclick=()=>{let a=$('start').value,b=$('end').value,c=+$('capital').value,g=+$('goal').value;if(!a||!b||a>b||c<0||g<=c||dt(b)-dt(a)>3660*86400000||dt(a).getFullYear()<2026||dt(b).getFullYear()>2099)return alert('日付と金額を確認してください');Object.assign(s,{start:a,end:b,capital:c,goal:g});if(save()){render();alert('保存しました')}};$('csv').onclick=()=>download('kabulog.csv','\ufeff日付,目標,収支\n'+[...new Set([...all,...Object.keys(s.entries)])].sort().map(k=>`${k},${all.includes(k)?Math.round(daily):''},${s.entries[k]??''}`).join('\n'),'text/csv');$('backup').onclick=()=>download('kabulog.json',JSON.stringify(s),'application/json');$('restore').onclick=()=>$('file').click();$('file').onchange=async e=>{try{let v=JSON.parse(await e.target.files[0].text());if(!/^\d{4}-\d{2}-\d{2}$/.test(v.start)||!/^\d{4}-\d{2}-\d{2}$/.test(v.end)||v.start>v.end||dt(v.end)-dt(v.start)>3660*86400000||!Number.isFinite(v.capital)||!Number.isFinite(v.goal)||v.goal<=v.capital||!v.entries||Object.entries(v.entries).some(([k,x])=>!/^\d{4}-\d{2}-\d{2}$/.test(k)||!Number.isFinite(x)))throw Error();if(confirm('現在のデータを置き換えますか？')){s=v;save();render()}}catch{alert('無効なバックアップです')}};}}
function edit(k){let old=s.entries[k],sign=old<0?-1:1;$('edit').innerHTML=`<div id="overlay"><div class="modal"><nav><b style="font-size:18px">${k.replaceAll('-','/')}</b><button id="close">×</button></nav><p><small>日次収支を入力</small></p><div class="grid"><button id="plus" class="pos">＋ 利益</button><button id="minus" class="neg">− 損失</button></div><p><input id="pnl" type="text" inputmode="numeric" placeholder="金額を入力" value="${old===undefined?'':Math.abs(old)}" style="font-size:24px;text-align:center"></p><strong id="preview" style="text-align:center;margin:15px 0"></strong><button id="record" style="width:100%;background:#168465;color:white;font-weight:bold;padding:14px">保存する</button><p style="text-align:center"><button id="delete" class="neg">記録を削除</button></p></div></div>`;function close(){$('edit').innerHTML=''}function update(){let n=Math.abs(Number($('pnl').value)||0);$('plus').style.background=sign===1?'#164e3b':'#263443';$('minus').style.background=sign===-1?'#632d35':'#263443';$('preview').className=sign===-1?'neg':'pos';$('preview').textContent=(sign===-1?'−':'+')+yen(n)}$('plus').onclick=()=>{sign=1;update()};$('minus').onclick=()=>{sign=-1;update()};$('pnl').oninput=()=>{$('pnl').value=$('pnl').value.replace(/[^0-9]/g,'');update()};$('close').onclick=close;$('overlay').onclick=e=>{if(e.target===$('overlay'))close()};$('record').onclick=()=>{let n=Number($('pnl').value);if($('pnl').value!==''&&Number.isSafeInteger(n)){s.entries[k]=sign*Math.abs(n);if(save()){close();render()}}};$('delete').onclick=()=>{if(confirm('この日の収支を削除しますか？')){delete s.entries[k];if(save()){close();render()}}};update()}
function download(name,data,type){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}render();setInterval(()=>{if(tab!=='settings'&&!$('overlay'))render()},60000);if('serviceWorker'in navigator)navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></html>
